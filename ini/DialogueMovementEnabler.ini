[GENERAL]

#  Unlocks camera rotation so you can look around in any direction.
bUnlockCamera = true

#  Automatically reload this INI when opening dialogue if the file was modified (enables live editing).
bHotReloadINI = true

[AUTOCLOSE]

#  Enable or disable auto-closing of the dialogue menu if the distance to the speaker is too large.
bAutoCloseMenus = false

#  The maximum distance (in in-game units) before the menu will automatically close.
#  Too small values can cause the menus to close unexpectedly.
fAutoCloseDistance = 1200.000000

#  The maximum distance (in in-game units) where the menu NEVER auto-closes (in relation to the players initial position when the menu was opened).
#  This is used as a failsafe when the initial distance is larger than the maximum allowed to prevent the menu from closing unexpectedly.
fAutoCloseTolerance = 300.000000


[HOOKS]

#  Optional TESV.exe 1.9.32.0 call-site overrides (hex, e.g. 0x00773380). Leave at 0x0 for automatic runtime discovery.
uGetDialogueLookAngleCallSite = 0x0
uStartDialogueForceGreetCallSite = 0x0
uInitDialogueLookAtCallSite = 0x0
uIsGamepadEnabledCallSite = 0x0
